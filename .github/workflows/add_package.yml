# This is a workflow to add a new package

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      package_name:
        description: 'Name of the package (must be unique)'
        required: true
        type: string
      repo_url:
        description: 'URL of primary source code repository'
        required: true
        type: string
      repo_type:
        description: 'Repository provider'
        required: true
        type: choice
        options:
          - github
          - gitlab
      email_address:
        description: 'Email address of primary contact (must be a repository contributor)'
        required: true
        type: string
      published:
        description: 'Indicate if you want the metrics published'
        required: false
        default: false
        type: choice
        options:
          - true
          - false
      description:
        description: 'Optional description for the package (overrides the repo version)'
        required: false
        type: string
      homepage_url:
        description: 'Optional URL of project home page (if different from repo)'
        required: false
        type: string
      documentation_url:
        description: 'Optional URL of project documentation (if different from repo)'
        required: false
        type: string
      cdash_url:
        description: 'Optional URL of project CDash dashboard'
        required: false
        type: string      

permissions:
  contents: write
  
jobs:
  add_package:
    runs-on: ubuntu-latest
    steps:
    - name: Create package
      run: |
        echo "${{ inputs.package_name }}"
        echo "${{ inputs.repo_url }}"
        echo "${{ inputs.repo_type }}"
        echo "${{ inputs.published }}"
        echo "${{ inputs.description }}"
        echo "${{ inputs.homepage_url }}"
        echo "${{ inputs.documentation_url }}"
        echo "${{ inputs.cdash_url }}"        
